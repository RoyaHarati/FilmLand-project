<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/media/photo/user.svg" />

    <link rel="stylesheet" href="../css/style.css" />
    <title>Login</title>
  </head>
  <body>
    <section class="login-section">
      <form class="form-login">
        <div class="logo-style">
          <p class="logo">🎬 FilmLand</p>
        </div>
        <div class="header-login">
          <a href="../index.html" class="back-a">← Back</a>
          <h2 class="h-login">Login Form</h2>
        </div>
        <div class="form-style">
          <label for="user">👤 User Name</label>
          <input
            type="text"
            id="user"
            class="user-login input"
            placeholder="Enter UserName"
            autocomplete="off"
          />
          <label for="pass">🔒 Password</label>
          <input
            type="password"
            id="pass"
            class="pass-login input"
            placeholder="Enter Password"
            autocomplete="off"

          />
          <button class="loginPage-btn">Login</button>
        </div>
      </form>
      <div class="error">
      </div>
    </section>

    <script src="../js/login.js"></script>
  </body>
</html>
